<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NestKB · 企业知识库</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23B42318'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 白屏诊断：模块加载期错误渲染到 DOM（生产排障用）
      window.addEventListener('error', function (e) {
        var el = document.createElement('pre');
        el.id = 'boot-error';
        el.style.cssText = 'padding:24px;color:#b42318;white-space:pre-wrap;font:13px/1.6 monospace';
        el.textContent = 'BOOT ERROR: ' + ((e.error && e.error.stack) || e.message);
        document.body.appendChild(el);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
