# docker/docker-compose.dev.yml —— 二选一：--profile pg（默认）或 --profile qdrant
services:
  postgres:
    profiles: ["pg"]
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: nestkb, POSTGRES_PASSWORD: nestkb, POSTGRES_DB: nestkb }
    ports: ["5433:5432"]                       # 避开本机常见 5432
    volumes: [pgdata:/var/lib/postgresql/data]
  mysql:
    profiles: ["qdrant"]
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: nestkb, MYSQL_DATABASE: nestkb }
    ports: ["3307:3306"]
    volumes: [mysqldata:/var/lib/mysql]
  qdrant:
    profiles: ["qdrant"]
    image: qdrant/qdrant:v1.14.1
    ports: ["6333:6333", "6334:6334"]          # 6333 HTTP / 6334 gRPC
    volumes: [qdrantdata:/qdrant/storage]
  minio:
    profiles: ["qdrant"]
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: nestkb, MINIO_ROOT_PASSWORD: nestkb123 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
volumes: { pgdata: {}, mysqldata: {}, qdrantdata: {}, miniodata: {} }
